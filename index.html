<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>message.txt — Найденный компьютер</title>

<style>
  :root{
    --luna-blue-1:#1f5fd6;
    --luna-blue-2:#3f8cf3;
    --luna-blue-3:#0a3fae;
    --taskbar-1:#2058d8;
    --taskbar-2:#173f9c;
    --start-green-1:#5ad14e;
    --start-green-2:#2e9b28;
    --start-green-3:#1f7a1c;
    --bezel-1:#e5e5df;
    --bezel-2:#c7c7bf;
    --bezel-3:#a9a9a0;
    --sky-1:#3a7bd5;
    --sky-2:#8ec9f0;
    --sky-3:#cfeafc;
    --hill-1:#3f9d33;
    --hill-2:#5cbf3f;
    --hill-3:#8fdd52;
    --win-gray:#ece9d8;
    --win-gray-dark:#c7c3b0;
    --font-ui: Tahoma, "Segoe UI", Verdana, Arial, sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    font-family:var(--font-ui);
    background:radial-gradient(ellipse at 50% 30%, #2a2a2e 0%, #101012 60%, #050506 100%);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:16px;
    user-select:none;
  }

  /* =========================================================
     POWER-ON FLICKER — brief, automatic, no interaction needed
     ========================================================= */
  #power-flash{
    position:fixed; inset:0; background:#fff; z-index:500;
    opacity:0; pointer-events:none;
    animation:power-on 900ms ease-out forwards;
  }
  @keyframes power-on{
    0%{ opacity:0; }
    8%{ opacity:0.9; }
    14%{ opacity:0.1; }
    20%{ opacity:0.7; }
    30%{ opacity:0; }
    100%{ opacity:0; }
  }

  /* =========================================================
     MONITOR SHELL
     ========================================================= */
  .monitor-wrap{
    width:min(1040px, 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .monitor{
    width:100%;
    aspect-ratio:4 / 3.15;
    background:linear-gradient(160deg, var(--bezel-1) 0%, var(--bezel-2) 55%, var(--bezel-3) 100%);
    border-radius:22px;
    padding:3.2% 3.2% 6.5%;
    box-shadow:
      0 30px 70px rgba(0,0,0,0.6),
      0 4px 0 rgba(255,255,255,0.35) inset,
      0 -6px 12px rgba(0,0,0,0.15) inset;
    position:relative;
  }

  .monitor::before{
    /* brand label, purely decorative */
    content:"CRT-VISION 900";
    position:absolute;
    left:50%; bottom:3%;
    transform:translateX(-50%);
    font-size:clamp(8px,1.1vw,11px);
    letter-spacing:2px;
    color:#6d6d64;
    font-family:Arial, sans-serif;
    font-weight:bold;
  }

  .power-led{
    position:absolute;
    right:6%; bottom:3.4%;
    width:9px; height:9px;
    border-radius:50%;
    background:#5ad14e;
    box-shadow:0 0 6px 2px rgba(90,209,78,0.9);
    animation:led-blink 3.2s ease-in-out infinite;
  }
  @keyframes led-blink{
    0%,92%,100%{ opacity:1; }
    96%{ opacity:0.4; }
  }

  .screen{
    position:relative;
    width:100%; height:100%;
    background:#000;
    border-radius:8px;
    overflow:hidden;
    box-shadow:
      0 0 0 2px #0a0a0a,
      inset 0 0 40px rgba(0,0,0,0.85),
      inset 0 0 90px rgba(0,0,0,0.5);
  }

  /* subtle scanline / curvature overlay for CRT authenticity */
  .screen::after{
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    z-index:80;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0.10) 0px, rgba(0,0,0,0.10) 1px, transparent 2px, transparent 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 65%, rgba(0,0,0,0.45) 100%);
    mix-blend-mode:multiply;
    opacity:0.5;
  }

  /* =========================================================
     DESKTOP
     ========================================================= */
  .desktop{
    position:absolute; inset:0;
    overflow:hidden;
  }

  .wallpaper{
    position:absolute; inset:0;
    background:linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 45%, var(--sky-3) 62%, var(--hill-2) 63%, var(--hill-1) 100%);
  }
  .wallpaper::before{
    /* rolling hill highlight */
    content:"";
    position:absolute; left:-10%; right:-10%; bottom:0; height:42%;
    background:radial-gradient(ellipse 70% 100% at 30% 100%, var(--hill-3) 0%, transparent 60%),
               radial-gradient(ellipse 60% 100% at 80% 100%, var(--hill-3) 0%, transparent 55%);
    opacity:0.8;
  }
  .wallpaper::after{
    /* a couple of soft clouds */
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 90px 24px at 20% 22%, rgba(255,255,255,0.85), transparent 70%),
      radial-gradient(ellipse 70px 18px at 24% 25%, rgba(255,255,255,0.7), transparent 70%),
      radial-gradient(ellipse 110px 26px at 72% 15%, rgba(255,255,255,0.8), transparent 70%),
      radial-gradient(ellipse 80px 20px at 78% 18%, rgba(255,255,255,0.65), transparent 70%);
  }

  .icons{
    position:absolute;
    top:2.5%; left:1.5%;
    display:flex;
    flex-direction:column;
    gap:2.4%;
    z-index:5;
  }

  .icon{
    width:clamp(48px, 8vw, 74px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:4px 3px;
    border-radius:3px;
    cursor:pointer;
    outline:none;
  }
  .icon.selected{
    background:rgba(60,120,215,0.35);
    outline:1px dotted rgba(255,255,255,0.7);
  }
  .icon-glyph{
    width:clamp(28px,4.2vw,38px);
    height:clamp(28px,4.2vw,38px);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(20px,3.2vw,28px);
    filter:drop-shadow(1px 2px 1px rgba(0,0,0,0.5));
  }
  .icon-label{
    color:#fff;
    font-size:clamp(8.5px,1.15vw,11px);
    text-align:center;
    line-height:1.2;
    text-shadow:1px 1px 2px rgba(0,0,0,0.9);
    max-width:100%;
    word-break:break-word;
  }
  .icon.selected .icon-label{
    background:rgba(30,80,180,0.85);
    padding:0 2px;
  }

  /* =========================================================
     NOTEPAD WINDOW
     ========================================================= */
  .window{
    position:absolute;
    top:8%; left:50%;
    transform:translateX(-50%);
    width:min(560px, 84%);
    height:min(420px, 72%);
    background:var(--win-gray);
    border:1px solid #0a3fae;
    border-radius:8px 8px 3px 3px;
    box-shadow:0 14px 34px rgba(0,0,0,0.55);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transform:translateX(-50%) scale(0.85);
    transition:opacity 180ms ease, transform 180ms ease;
  }
  .window.open{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) scale(1);
  }
  .window.minimized{
    opacity:0;
    pointer-events:none;
    transform:translateX(-50%) scale(0.85) translateY(40%);
  }

  .titlebar{
    height:clamp(24px,3.4vw,30px);
    background:linear-gradient(180deg, var(--luna-blue-2) 0%, var(--luna-blue-1) 45%, var(--luna-blue-3) 100%);
    display:flex;
    align-items:center;
    padding:0 4px 0 6px;
    flex-shrink:0;
  }
  .titlebar .title-icon{
    font-size:12px;
    margin-right:5px;
  }
  .titlebar .title-text{
    color:#fff;
    font-size:clamp(10.5px,1.5vw,13px);
    font-weight:bold;
    text-shadow:1px 1px 1px rgba(0,0,0,0.4);
    flex:1;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
  }
  .title-buttons{
    display:flex;
    gap:2px;
  }
  .title-buttons button{
    width:clamp(18px,2.6vw,22px);
    height:clamp(16px,2.3vw,20px);
    border:1px solid rgba(255,255,255,0.5);
    border-radius:3px;
    background:linear-gradient(180deg,#3f8ef0,#1c5fd0);
    color:#fff;
    font-size:11px;
    font-weight:bold;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .title-buttons button:active{ filter:brightness(0.85); }
  .title-buttons .btn-close{
    background:linear-gradient(180deg,#f16a5c,#c8281a);
  }

  .menubar{
    background:var(--win-gray);
    border-bottom:1px solid var(--win-gray-dark);
    display:flex;
    gap:14px;
    padding:2px 8px;
    font-size:clamp(9.5px,1.3vw,12px);
    color:#000;
    flex-shrink:0;
  }
  .menubar span{ cursor:pointer; padding:1px 3px; border-radius:2px; }
  .menubar span:hover{ background:#3f8cf3; color:#fff; }

  .notepad-body{
    flex:1;
    background:#fff;
    overflow:auto;
    padding:10px 12px;
  }
  .notepad-text{
    width:100%;
    height:100%;
    border:none;
    outline:none;
    resize:none;
    background:transparent;
    font-family:"Courier New", Consolas, monospace;
    font-size:clamp(11px,1.5vw,13.5px);
    line-height:1.55;
    color:#111;
    white-space:pre-wrap;
  }

  .statusbar{
    height:clamp(16px,2.2vw,20px);
    background:var(--win-gray);
    border-top:1px solid #fff;
    box-shadow:0 -1px 0 var(--win-gray-dark) inset;
    font-size:clamp(8.5px,1.15vw,10.5px);
    color:#333;
    display:flex;
    align-items:center;
    padding:0 8px;
    flex-shrink:0;
  }

  /* generic desktop toast for "dummy" interactions */
  .toast{
    position:absolute;
    left:50%; bottom:14%;
    transform:translateX(-50%) translateY(8px);
    background:rgba(20,20,20,0.85);
    color:#fff;
    font-size:clamp(9px,1.3vw,11.5px);
    padding:6px 12px;
    border-radius:4px;
    opacity:0;
    transition:opacity 160ms ease, transform 160ms ease;
    pointer-events:none;
    z-index:120;
    white-space:nowrap;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  /* =========================================================
     START MENU — decorative only
     ========================================================= */
  .start-menu{
    position:absolute;
    left:1%;
    bottom:calc(6.2% + 4px);
    width:min(230px, 62%);
    background:var(--win-gray);
    border:1px solid #0a3fae;
    border-radius:6px 6px 0 0;
    box-shadow:0 10px 26px rgba(0,0,0,0.5);
    overflow:hidden;
    z-index:90;
    opacity:0;
    pointer-events:none;
    transform:translateY(8px);
    transition:opacity 140ms ease, transform 140ms ease;
  }
  .start-menu.open{
    opacity:1;
    pointer-events:auto;
    transform:translateY(0);
  }
  .start-menu-header{
    background:linear-gradient(90deg, var(--luna-blue-1), var(--luna-blue-2));
    color:#fff;
    font-size:clamp(11px,1.6vw,13px);
    font-weight:bold;
    padding:8px 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .start-avatar{
    width:26px; height:26px;
    border-radius:4px;
    background:linear-gradient(160deg,#ffce54,#f0a020);
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
    border:1px solid rgba(255,255,255,0.6);
  }
  .start-menu-items{
    padding:4px 0;
  }
  .start-menu-items div{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 12px;
    font-size:clamp(9.5px,1.35vw,12px);
    color:#000;
    cursor:pointer;
  }
  .start-menu-items div:hover{
    background:#3f8cf3;
    color:#fff;
  }
  .start-menu-items .sep{
    height:1px;
    background:var(--win-gray-dark);
    margin:4px 8px;
    padding:0;
  }

  /* =========================================================
     TASKBAR — buttons here are clickable but purely decorative
     ========================================================= */
  .taskbar{
    position:absolute;
    left:0; right:0; bottom:0;
    height:6.2%;
    min-height:24px;
    background:linear-gradient(180deg, var(--taskbar-1) 0%, var(--taskbar-2) 100%);
    border-top:1px solid #4f8cf5;
    display:flex;
    align-items:center;
    padding:0 4px;
    gap:6px;
    z-index:60;
  }

  .start-btn{
    height:82%;
    display:flex;
    align-items:center;
    gap:5px;
    padding:0 10px 0 6px;
    background:linear-gradient(180deg, var(--start-green-1) 0%, var(--start-green-2) 55%, var(--start-green-3) 100%);
    border:1px solid #145012;
    border-radius:5px;
    color:#fff;
    font-weight:bold;
    font-style:italic;
    font-size:clamp(10px,1.6vw,13px);
    cursor:pointer;
    box-shadow:0 0 0 1px rgba(255,255,255,0.25) inset;
  }
  .start-btn:active, .start-btn.active{
    filter:brightness(0.88);
  }
  .flag{
    width:14px; height:14px;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:1px;
    flex-shrink:0;
  }
  .flag span:nth-child(1){ background:#f25022; }
  .flag span:nth-child(2){ background:#7fba00; }
  .flag span:nth-child(3){ background:#00a4ef; }
  .flag span:nth-child(4){ background:#ffb900; }

  .taskbar-sep{
    width:1px;
    height:70%;
    background:rgba(255,255,255,0.25);
    flex-shrink:0;
  }

  .quicklaunch{
    display:flex;
    gap:5px;
    flex-shrink:0;
  }
  .ql-btn{
    width:clamp(18px,2.6vw,22px);
    height:clamp(18px,2.6vw,22px);
    border-radius:3px;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(10px,1.6vw,13px);
    cursor:pointer;
    background:transparent;
  }
  .ql-btn:hover{ background:rgba(255,255,255,0.18); }
  .ql-btn:active{ background:rgba(0,0,0,0.15); }

  .taskbar-windows{
    flex:1;
    display:flex;
    gap:5px;
    overflow:hidden;
    height:82%;
    align-items:center;
  }
  .taskbar-window-btn{
    display:none;
    align-items:center;
    gap:5px;
    height:100%;
    max-width:150px;
    padding:0 8px;
    background:linear-gradient(180deg,#3f79e8,#2456c2);
    border:1px solid #12306e;
    border-radius:4px;
    color:#fff;
    font-size:clamp(9px,1.4vw,11px);
    cursor:pointer;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
  }
  .taskbar-window-btn.show{ display:flex; }
  .taskbar-window-btn.inactive{
    background:linear-gradient(180deg,#1f4dab,#123072);
  }

  .tray{
    display:flex;
    align-items:center;
    gap:6px;
    height:82%;
    padding:0 8px;
    background:rgba(0,0,0,0.12);
    border-radius:4px 0 0 4px;
    flex-shrink:0;
  }
  .tray-icon{
    font-size:clamp(10px,1.5vw,12px);
    cursor:pointer;
    opacity:0.9;
  }
  .tray-icon:hover{ opacity:1; }
  .clock{
    color:#fff;
    font-size:clamp(9px,1.4vw,11.5px);
    min-width:44px;
    text-align:center;
  }

  @media (max-width:480px){
    .monitor{ aspect-ratio:4/3.4; border-radius:16px; padding:4.5% 4.5% 8%; }
    .window{ width:92%; height:76%; top:6%; }
    .icons{ gap:5%; }
  }
</style>
</head>
<body>

<div id="power-flash"></div>

<div class="monitor-wrap">
  <div class="monitor">
    <div class="power-led"></div>
    <div class="screen">
      <div class="desktop" id="desktop">
        <div class="wallpaper"></div>

        <!-- =====================================================
             DESKTOP ICONS
             Иконки "Мой компьютер" и "Корзина" — чисто декоративные
             (мишура), реагируют на клик, но ничего не открывают.
             Только "message.txt" реально открывает окно.
             ===================================================== -->
        <div class="icons" id="icons">
          <div class="icon" data-name="Мой компьютер" tabindex="0">
            <div class="icon-glyph">🖥️</div>
            <div class="icon-label">Мой компьютер</div>
          </div>
          <div class="icon" data-name="Корзина" tabindex="0">
            <div class="icon-glyph">🗑️</div>
            <div class="icon-label">Корзина</div>
          </div>
          <div class="icon" data-name="Сетевое окружение" tabindex="0">
            <div class="icon-glyph">🌐</div>
            <div class="icon-label">Сетевое окружение</div>
          </div>
          <div class="icon" id="icon-message" data-name="message.txt" tabindex="0">
            <div class="icon-glyph">📄</div>
            <div class="icon-label">message.txt</div>
          </div>
        </div>

        <!-- =====================================================
             NOTEPAD WINDOW — единственное реальное действие на
             странице: открывает текст сообщения. Кнопки свернуть/
             развернуть — декоративные, закрыть — реально закрывает.
             ===================================================== -->
        <div class="window" id="notepad-window" role="dialog" aria-label="message.txt — Блокнот">
          <div class="titlebar" id="titlebar">
            <span class="title-icon">📄</span>
            <span class="title-text">message.txt — Блокнот</span>
            <div class="title-buttons">
              <button type="button" id="btn-min" title="Свернуть">_</button>
              <button type="button" id="btn-max" title="Развернуть">□</button>
              <button type="button" id="btn-close" title="Закрыть">×</button>
            </div>
          </div>
          <div class="menubar">
            <span>Файл</span><span>Правка</span><span>Формат</span><span>Вид</span><span>Справка</span>
          </div>
          <div class="notepad-body">
            <!-- =========================================================
                 EDIT YOUR MESSAGE HERE
                 =========================================================
                 Текст ниже — это и есть содержимое message.txt, которое
                 видит пользователь при открытии файла.
            -->
            <textarea class="notepad-text" id="doc-body" readonly>Если ты это читаешь — значит, компьютер всё-таки включился, и файл открылся. Я не была уверена, что после всего этого времени на нём вообще что-то останется.

Это не письмо в привычном смысле. Я не знаю, кто ты и когда именно нашёл этот компьютер. Может, прошло несколько месяцев. Может — гораздо больше.

Я специально не хранила это ни на сервере, ни в облаке. Только здесь. На одной старой машине, которую можно потерять, спрятать или выключить — но не выследить.

[ ПРЕДУПРЕЖДЕНИЕ ] Не подключай это устройство к рабочим или личным сетям без крайней необходимости. Часть данных на нём повреждена не случайно.

Если коротко: то, что случилось на объекте, не было аварией. Записи, которые я собрала до того, как всё отключили, находятся не здесь — но этот файл укажет, где их искать.

Ищи в тех местах, о которых мы говорили последний раз. Ты поймёшь, когда доберёшься.

Будь осторожен. И, пожалуйста — не доверяй никому, кто скажет, что нашёл это раньше тебя.</textarea>
            <!-- END EDITABLE MESSAGE -->
          </div>
          <div class="statusbar">Готово</div>
        </div>

        <!-- generic toast used by all decorative ("мишура") buttons -->
        <div class="toast" id="toast"></div>

        <!-- =====================================================
             START MENU — полностью декоративное, пунктов много,
             ни один реально ничего не открывает.
             ===================================================== -->
        <div class="start-menu" id="start-menu">
          <div class="start-menu-header">
            <div class="start-avatar">👤</div>
            <span>Пользователь</span>
          </div>
          <div class="start-menu-items">
            <div data-name="Мои документы">📁 Мои документы</div>
            <div data-name="Панель управления">⚙️ Панель управления</div>
            <div data-name="Принтеры и факсы">🖨️ Принтеры и факсы</div>
            <div data-name="Справка и поддержка">❓ Справка и поддержка</div>
            <div class="sep"></div>
            <div data-name="Выполнить...">▶️ Выполнить...</div>
            <div class="sep"></div>
            <div data-name="Завершение работы">🔒 Завершение работы...</div>
          </div>
        </div>

        <!-- =====================================================
             TASKBAR — Пуск, значки быстрого запуска и трея
             кликабельны, но являются пустышкой (мишура).
             ===================================================== -->
        <div class="taskbar">
          <button type="button" class="start-btn" id="start-btn">
            <span class="flag"><span></span><span></span><span></span><span></span></span>
            Пуск
          </button>

          <div class="taskbar-sep"></div>

          <div class="quicklaunch" id="quicklaunch">
            <div class="ql-btn" data-name="Свернуть все окна" title="Свернуть все окна">🗔</div>
            <div class="ql-btn" data-name="Internet Explorer" title="Internet Explorer">🌐</div>
            <div class="ql-btn" data-name="Outlook Express" title="Outlook Express">✉️</div>
          </div>

          <div class="taskbar-sep"></div>

          <div class="taskbar-windows">
            <button type="button" class="taskbar-window-btn" id="taskbar-msg-btn">
              📄 message.txt — Блокнот
            </button>
          </div>

          <div class="tray">
            <span class="tray-icon" data-name="Громкость">🔊</span>
            <span class="tray-icon" data-name="Сеть">📶</span>
            <span class="clock" id="clock">00:00</span>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
(function(){

  /* =========================================================
     TOAST — общая обратная связь для декоративных элементов
     ========================================================= */
  const toast = document.getElementById("toast");
  let toastTimer = null;
  function showToast(text){
    toast.textContent = text;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1100);
  }

  /* =========================================================
     CLOCK — просто показывает реальное время в трее
     ========================================================= */
  function updateClock(){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, "0");
    const mm = String(now.getMinutes()).padStart(2, "0");
    document.getElementById("clock").textContent = hh + ":" + mm;
  }
  updateClock();
  setInterval(updateClock, 15000);

  /* =========================================================
     DESKTOP ICON SELECTION + OPENING message.txt
     ========================================================= */
  const icons = document.querySelectorAll(".icon");
  const messageIcon = document.getElementById("icon-message");
  const notepadWindow = document.getElementById("notepad-window");
  const taskbarMsgBtn = document.getElementById("taskbar-msg-btn");

  function deselectAllIcons(){
    icons.forEach(ic => ic.classList.remove("selected"));
  }

  icons.forEach(icon => {
    icon.addEventListener("click", (e) => {
      e.stopPropagation();
      deselectAllIcons();
      icon.classList.add("selected");
      if(icon === messageIcon){
        openNotepad();
      } else {
        showToast(icon.dataset.name + " — недоступно на этом устройстве");
      }
    });
  });

  document.getElementById("desktop").addEventListener("click", () => {
    deselectAllIcons();
    closeStartMenu();
  });

  function openNotepad(){
    notepadWindow.classList.remove("minimized");
    notepadWindow.classList.add("open");
    taskbarMsgBtn.classList.add("show", "active");
    taskbarMsgBtn.classList.remove("inactive");
  }

  function closeNotepad(){
    notepadWindow.classList.remove("open", "minimized");
    taskbarMsgBtn.classList.remove("show", "active", "inactive");
  }

  function minimizeNotepad(){
    notepadWindow.classList.add("minimized");
    taskbarMsgBtn.classList.add("inactive");
  }

  document.getElementById("btn-close").addEventListener("click", (e) => {
    e.stopPropagation();
    closeNotepad();
  });

  document.getElementById("btn-min").addEventListener("click", (e) => {
    e.stopPropagation();
    minimizeNotepad();
  });

  document.getElementById("btn-max").addEventListener("click", (e) => {
    e.stopPropagation();
    // декоративная кнопка — лёгкая анимация "разворота", без реальной логики
    notepadWindow.animate(
      [{ transform: notepadWindow.style.transform || getComputedStyle(notepadWindow).transform },
       { transform: "translateX(-50%) scale(1.015)" },
       { transform: "translateX(-50%) scale(1)" }],
      { duration: 180, easing: "ease-out" }
    );
  });

  taskbarMsgBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    if(notepadWindow.classList.contains("minimized") || !notepadWindow.classList.contains("open")){
      openNotepad();
    } else {
      minimizeNotepad();
    }
  });

  // не даём кликам внутри окна закрывать выделение иконок
  notepadWindow.addEventListener("click", (e) => e.stopPropagation());

  /* =========================================================
     START MENU + TASKBAR BUTTONS — чистая мишура (пустышка)
     ========================================================= */
  const startBtn = document.getElementById("start-btn");
  const startMenu = document.getElementById("start-menu");

  function openStartMenu(){
    startMenu.classList.add("open");
    startBtn.classList.add("active");
  }
  function closeStartMenu(){
    startMenu.classList.remove("open");
    startBtn.classList.remove("active");
  }

  startBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    if(startMenu.classList.contains("open")){
      closeStartMenu();
    } else {
      openStartMenu();
    }
  });

  startMenu.addEventListener("click", (e) => e.stopPropagation());

  document.querySelectorAll(".start-menu-items div[data-name]").forEach(item => {
    item.addEventListener("click", () => {
      showToast(item.dataset.name + " — недоступно");
      closeStartMenu();
    });
  });

  document.querySelectorAll(".ql-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      showToast(btn.dataset.name + " — недоступно");
    });
  });

  document.querySelectorAll(".tray-icon").forEach(icon => {
    icon.addEventListener("click", (e) => {
      e.stopPropagation();
      showToast(icon.dataset.name + " — недоступно");
    });
  });

})();
</script>

</body>
</html>
